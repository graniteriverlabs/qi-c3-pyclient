[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qi-c3-pyclient"
version = "1.0.0"
description = "GRL C3 automation client - drive the GRL wireless-charging C3 test applications from Python."
readme = "README.md"
# Kept in step with _MIN_PYTHON in grlps_c3_client/__init__.py, so pip and the import-time check
# agree. The wheel is pure Python, so one build covers every listed version.
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "GRL Platform Solutions" }]
keywords = ["grl", "qi", "wireless-charging", "wpc", "c3", "mpp", "test-automation"]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
# Everything needed for both build types, so there is one install command and it always works.
# Only `requests` is used on the REST path; the other two are needed by WebSocket builds, which
# stream live measurements and raise operator pop-ups that must be answered by clicking the real
# window. Making them optional saved a REST-only site two small packages and cost everyone else a
# failed run on their first WebSocket build, which is a bad trade.
dependencies = [
    "requests>=2.28.0",
    "websocket-client>=1.6.0",
    "pywinauto>=0.6.8",
]

[project.scripts]
c3-init = "grlps_c3_client._bootstrap:main"
c3-apps = "grlps_c3_client._cli:apps"
c3-testcases = "grlps_c3_client._cli:testcases"
c3-run = "grlps_c3_client._cli:run"
c3-exerciser = "grlps_c3_client._cli:exerciser"

[tool.setuptools.packages.find]
where = ["."]
include = ["grlps_c3_client*"]

[tool.setuptools.package-data]
grlps_c3_client = [
    "grl_config.json",
    "JSON_User_input/*/*",
    "JSON_User_input/*/*/*",
    "docs/*.md",
    "_internal/API/*.json",
]
